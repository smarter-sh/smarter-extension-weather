# Build the extension's archive on each v* tag, attach it to the GitHub release, and print its
# sha256, which the release's registry entry needs: extensions/<slug>/<version>.yaml in
# smarter-sh/extensions-registry.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check that the tag is the manifest's version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} is not v${VERSION}"; exit 1; }
      - name: Build the archive
        id: build
        run: |
          python scripts/package.py dist | tee build.txt
          echo "archive=$(sed -n 1p build.txt)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sed -n 2p build.txt)" >> "$GITHUB_OUTPUT"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${{ steps.build.outputs.archive }}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "sha256: ${{ steps.build.outputs.sha256 }}"
      - name: Registry entry
        run: |
          echo "### Registry entry" >> "$GITHUB_STEP_SUMMARY"
          echo "archive_url: https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename ${{ steps.build.outputs.archive }})" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256: ${{ steps.build.outputs.sha256 }}" >> "$GITHUB_STEP_SUMMARY"
