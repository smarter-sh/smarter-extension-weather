# Release the extension with semantic-release, on each push to main: see release.config.js. A fix
# releases a patch, a feat a minor version, and a BREAKING CHANGE a major version; other commits
# release nothing. A release sets the version in pyproject.toml, adds its notes to CHANGELOG.md,
# commits both and tags the commit v<version>, and creates the GitHub release, with the archive and
# its sha256 attached. The summary prints what the release's registry entry needs:
# extensions/<slug>/<version>.yaml in smarter-sh/extensions-registry.
#
# It can also be started by hand, from the Actions tab, for example to retry a failed release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install semantic-release's plugins
        run: npm install --no-audit --no-fund

      - name: Semantic release
        id: semantic
        uses: cycjimmy/semantic-release-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com

      - name: Registry entry
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          TAG: ${{ steps.semantic.outputs.new_release_git_tag }}
        run: |
          ARCHIVE=$(ls dist/*.zip)
          {
            echo "### Registry entry"
            echo ""
            echo "archive_url: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "${ARCHIVE}")"
            echo ""
            echo "sha256: $(cut -d ' ' -f 1 "${ARCHIVE}.sha256")"
          } >> "$GITHUB_STEP_SUMMARY"
